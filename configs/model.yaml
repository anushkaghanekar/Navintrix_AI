# Detector / tracker configuration.

model:
  weights_path: "models/best.pt"
  confidence_threshold: 0.5
  iou_threshold: 0.45

classes:
  # CLASS-ID CONTRACT: the model's class IDs are this full list in this
  # exact order (classes.normal first, then classes.emergency). Detection
  # maps YOLO class indexes through this order, and every dataset-prep
  # script (scripts/prepare_*.py) writes label IDs to match.
  normal:
    - car
    - motorcycle
    - bus
    - truck
  emergency:
    - ambulance
    - fire_truck
    - police_vehicle

tracker:
  name: bytetrack
  track_buffer: 30       # frames to keep a lost track alive before dropping it
  match_thresh: 0.8      # BYTE cost gate: keep track/det pairs with (1 - IoU) <= this
  track_thresh: 0.5      # detections >= this score are "high"; below go to byte pool
  low_match_thresh: 0.5  # BYTE cost gate for the low-score (byte) recovery stage
  kalman:
    process_std: 0.05    # constant-velocity Kalman process noise per frame
    measurement_std: 0.5 # box measurement noise
# Dataset-specific class mappings used by scripts/prepare_*.py.
# `datasets.<name>.class_mapping`: source-class name -> base class name from
# `classes.normal`/`classes.emergency`; `null` means "drop this class during
# conversion" (e.g. UA-DETRAC's "others" is a heterogeneous remainder class
# with no fixed semantics, so folding it into one of our classes would teach
# the model label noise).
datasets:
  detrac:
    class_mapping:
      car: car
      bus: bus
      van: truck
      others: null
  # Optional per-source mapping for scripts/prepare_emergency.py. Each
  # emergency source may name its classes differently (e.g. "police_car" vs
  # "police"); map them onto the classes.emergency set here, or to `null` to
  # drop a foreign class. Unlisted source classes that ARE emergency classes
  # fall back to identity; unlisted foreign classes are dropped with a count.
  # emergency:
  #   class_mapping:
  #     police: police_vehicle
  #     police_car: police_vehicle
  #     cyclist: null
