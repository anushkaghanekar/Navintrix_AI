# Signal timing and controller coefficients.
# Starting values only — these must be experimentally tuned and the tuning
# process (or at least the final chosen values and why) belongs in the report.

signal:
  min_green_seconds: 10
  max_green_seconds: 60
  yellow_seconds: 3
  all_red_seconds: 2

controller:
  # priority_score = alpha*density + beta*queue_length
  #                + gamma*waiting_time + delta*traffic_flow
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  delta: 1.0
  fairness:
    max_wait_before_forced_green_seconds: 90   # anti-starvation ceiling

emergency:
  # How emergency priority interacts with the safety state machine —
  # values here should never let anything skip yellow/all-red.
  min_distance_to_confirm_approach_m: null   # fill in once camera calibration exists
  clearance_confirmation_frames: 15          # frames of "gone" before declaring EMERGENCY_PASSED
